<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHO ONE CORP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
 
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg:       #f5f4f0;
      --bg-sub:   #eeece7;
      --ink:      #1a1917;
      --muted:    #5a5955;
      --border:   #c8c6bf;
      --pink:     #c0426a;
      --pink-lt:  #f7e8ed;
      --pink-mid: #e8a0b8;
      --serif:    'Noto Serif JP', serif;
      --sans:     'Noto Sans JP', sans-serif;
    }
 
    html, body {
      width: 100%;
      min-height: 100vh;
    }
 
    /* ── スプラッシュ画面（初期は非表示） ── */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
    }
 
    /* スプラッシュ再生中クラス */
    #splash.playing {
      animation: splashLife 5.2s ease forwards;
      pointer-events: all;
    }
 
    @keyframes splashLife {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }
 
    .splash-ring {
      position: relative;
      width: 160px;
      height: 160px;
    }
 
    .ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid #c8c6bf;
      opacity: 0;
      animation: ringExpand 1s 0.2s cubic-bezier(0.22,1,0.36,1) forwards;
    }
 
    .ring-inner {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 2.5px solid var(--ink);
      opacity: 0;
      animation: ringExpand 0.9s 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
    }
 
    @keyframes ringExpand {
      0%   { opacity: 0; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1); }
    }
 
    .splash-kanji {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-weight: 300;
      font-size: 58px;
      color: var(--pink);
      opacity: 0;
      animation: kanjiAppear 0.8s 0.7s ease forwards;
    }
 
    @keyframes kanjiAppear {
      0%   { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
 
    .splash-text {
      text-align: center;
      opacity: 0;
      animation: textRise 0.9s 1s ease forwards;
    }
 
    @keyframes textRise {
      0%   { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
 
    .splash-name {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(28px, 6vw, 42px);
      color: var(--ink);
      letter-spacing: 0.3em;
      margin-bottom: 10px;
    }
 
    .splash-sub {
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(13px, 2.5vw, 17px);
      color: var(--muted);
      letter-spacing: 0.15em;
      line-height: 2.0;
    }
 
    .splash-line {
      width: 0;
      height: 1px;
      background: var(--border);
      animation: lineGrow 0.8s 1.1s ease forwards;
    }
 
    @keyframes lineGrow {
      0%   { width: 0; }
      100% { width: 60px; }
    }
 
    /* ── 施設選択画面（最初から表示） ── */
    #select-screen {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      opacity: 1;
    }
 
    .select-title {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(13px, 2.5vw, 17px);
      color: var(--muted);
      letter-spacing: 0.25em;
      margin-bottom: 48px;
      text-align: center;
    }
 
    /* カードリスト */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 520px;
    }
 
    /* 各施設カード */
    .facility-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px 28px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      cursor: pointer;
    }
 
    .facility-card:hover {
      border-color: var(--pink);
      background: var(--pink-lt);
      transform: translateY(-2px);
    }
 
    /* りんぐカードを強調 */
    .facility-card.ring {
      border-color: var(--pink-mid);
      background: var(--pink-lt);
    }
    .facility-card.ring:hover {
      border-color: var(--pink);
      background: #f0d5de;
    }
 
    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-size: 20px;
      color: var(--muted);
      flex-shrink: 0;
      background: var(--bg);
    }
 
    .facility-card.ring .card-icon {
      border-color: var(--pink-mid);
      color: var(--pink);
    }
 
    .card-body {
      flex: 1;
    }
 
    .card-name {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(16px, 3vw, 20px);
      color: var(--ink);
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
 
    .card-desc {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.06em;
      line-height: 1.6;
    }
 
    .facility-card.ring .card-desc { color: var(--pink); }
 
    .card-arrow {
      font-size: 20px;
      color: var(--border);
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .facility-card:hover .card-arrow { color: var(--pink); }
 
    /* コピーライト */
    .copy {
      margin-top: 52px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
 
  <!-- スプラッシュ -->
  <div id="splash">
    <div class="splash-ring">
      <div class="ring-outer"></div>
      <div class="ring-inner"></div>
      <div class="splash-kanji">輪</div>
    </div>
    <div class="splash-text">
      <div class="splash-name">り ん ぐ</div>
      <div class="splash-sub">
        児童発達支援<br>
        放課後等デイサービス
      </div>
    </div>
    <div class="splash-line"></div>
  </div>
 
  <!-- 施設選択画面 -->
  <div id="select-screen">
 
    <p class="select-title">事業所を選択してください</p>
 
    <div class="card-list">
 
      <!-- りんぐ（強調） -->
      <a class="facility-card ring" href="#" id="ring-btn">
        <div class="card-icon">輪</div>
        <div class="card-body">
          <p class="card-name">りんぐ</p>
          <p class="card-desc">児童発達支援・放課後等デイサービス</p>
        </div>
        <span class="card-arrow">→</span>
      </a>
 
      <!-- 内装・用品 事業所 -->
      <a class="facility-card" href="#">
        <div class="card-icon">多</div>
        <div class="card-body">
          <p class="card-name">多機能型事業所　マハロ</p>
          <p class="card-desc"></p>
        </div>
        <span class="card-arrow">→</span>
      </a>
 
      <!-- SHO ONE CORP -->
      <a class="facility-card" href="#">
        <div class="card-icon">S</div>
        <div class="card-body">
          <p class="card-name">SHO ONE CORP</p>
          <p class="card-desc"></p>
        </div>
        <span class="card-arrow">→</span>
      </a>
 
    </div>
 
    <p class="copy">© 2025 SHO ONE CORP</p>
 
  </div>
 
  <script>
    // りんぐボタンを押すとスプラッシュ再生 → index.htmlへ遷移
    document.getElementById('ring-btn').addEventListener('click', function(e) {
      e.preventDefault();
 
      const splash = document.getElementById('splash');
      const select = document.getElementById('select-screen');
 
      // 選択画面を非表示にしてスプラッシュを再生
      select.style.opacity = '0';
      select.style.pointerEvents = 'none';
 
      // アニメーションをリセットしてから再生
      splash.classList.remove('playing');
      void splash.offsetWidth; // リフロー
      splash.classList.add('playing');
 
      // 5.2秒後にindex.htmlへ遷移
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 5200);
    });
  </script>
 
</body>
</html>
